paragraph=이 보드에만 있는 하드웨어를 쓴다 — nPM1300 PMIC(충전 상태, 배터리 전압, Sense 센서 전원), LSM6DS3TR-C IMU, PY25Q64 온보드 플래시, RGB LED. Sense 의 IMU·마이크는 GPIO 가 아니라 PMIC 의 LDO1 로 전원이 들어가므로 PMIC.setSensorPower(true) 가 먼저다. 핀 배정 근거는 docs/boards/XIAO-nRF54LM20A.md.
